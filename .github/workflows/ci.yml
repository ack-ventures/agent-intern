name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (with dev extras)
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Unit tests (offline — no agy, no quota)
        run: pytest test_server.py test_swarm.py test_codex.py test_copilot.py test_cursor.py test_claude.py -q

      - name: Package build smoke (sdist + wheel include every bridge module)
        run: |
          pip install build
          python -m build
          python -c "import glob, zipfile; w=glob.glob('dist/*.whl')[0]; z=zipfile.ZipFile(w); names=z.namelist(); assert all(m in names for m in ('claude_bridge.py','codex_bridge.py','copilot_bridge.py','cursor_bridge.py','server.py','swarm.py','swarm_watch.py'))"
